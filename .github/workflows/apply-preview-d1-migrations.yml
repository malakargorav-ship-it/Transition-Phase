name: Apply Preview D1 migrations
on:
  workflow_dispatch:
    inputs:
      confirm_preview_database:
        description: Type APPLY to confirm this is the non-production Preview D1 database
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: transition-phase-preview-d1-migrations
  cancel-in-progress: false
jobs:
  migrate:
    if: ${{ inputs.confirm_preview_database == 'APPLY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/individual-accounts-exam-engine
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply migrations 0001–0007 to Preview D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_PREVIEW_D1_DATABASE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID repository secret}"
          : "${CLOUDFLARE_PREVIEW_D1_DATABASE_ID:?Missing CLOUDFLARE_PREVIEW_D1_DATABASE_ID repository secret}"
          for migration in migrations/000{1,2,3,4,5,6,7}_*.sql; do
            echo "Applying $migration"
            npx --yes wrangler@4 d1 execute "$CLOUDFLARE_PREVIEW_D1_DATABASE_ID" --remote --file="$migration"
          done
          echo "All Preview D1 migrations applied."
